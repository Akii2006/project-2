<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Patient Statistics</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container-fluid mt-4">

        <div class="row justify-content-center">

            <!-- ================= Monthly Patient Statistics ================= -->

            <div class="col-lg-8">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white">

                        <h5 class="mb-0">
                            <i class="bi bi-bar-chart-fill"></i> Monthly Patient Statistics
                        </h5>

                    </div>

                    <div class="card-body">

                        <div class="table-responsive">

                            <table class="table table-bordered table-hover text-center align-middle">

                                <thead class="table-primary">

                                    <tr>
                                        <th>Month</th>
                                        <th>Patients</th>
                                    </tr>

                                </thead>

                                <tbody>

                                    <tr>
                                        <td>January</td>
                                        <td>120</td>
                                    </tr>

                                    <tr>
                                        <td>February</td>
                                        <td>150</td>
                                    </tr>

                                    <tr>
                                        <td>March</td>
                                        <td>175</td>
                                    </tr>

                                    <tr>
                                        <td>April</td>
                                        <td>200</td>
                                    </tr>

                                    <tr>
                                        <td>May</td>
                                        <td>220</td>
                                    </tr>

                                    <tr>
                                        <td>June</td>
                                        <td>260</td>
                                    </tr>

                                    <tr>
                                        <td>July</td>
                                        <td>280</td>
                                    </tr>

                                    <tr>
                                        <td>August</td>
                                        <td>300</td>
                                    </tr>

                                    <tr>
                                        <td>September</td>
                                        <td>315</td>
                                    </tr>

                                    <tr>
                                        <td>October</td>
                                        <td>330</td>
                                    </tr>

                                    <tr>
                                        <td>November</td>
                                        <td>350</td>
                                    </tr>

                                    <tr>
                                        <td>December</td>
                                        <td>380</td>
                                    </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
